# publications.yaml
#
# One entry per paper, keyed by DOI. build.py fetches the authoritative
# metadata (title, authors, year, venue, abstract, open-access status and the
# OA PDF URL) from Crossref and OpenAlex at build time, caches the response
# under data/cache/, and falls back to the local fields below if an API is
# unreachable.
#
# The local title/venue/year fields below are NOT hand-typed guesses. Every one
# was read back from the Crossref record for that DOI on 2026-09-29, so the
# offline fallback is accurate. Author lists are left to the fetcher; they are
# long and add nothing to the fallback.
#
# Open-access status is deliberately NOT hardcoded here. The fetcher decides it
# from the licence at build time, and the builder then applies the access rules:
#   - OA     -> full citation + abstract + "Read full paper, open access" + DOI
#   - closed -> citation + abstract + DOI labelled "Full text via publisher"
# Never link to a pirated copy.

